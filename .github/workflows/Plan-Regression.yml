name: Plan Regression

on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
      package-version:
        required: true
        type: string
      target-environment:
        required: true
        type: string

permissions:
  contents: read
  packages: read
  pull-requests: read

env:
  NUGET_RESTORE_MSBUILD_ARGS: /p:Configuration=Release

jobs:
  deploy_and_test:
    name: Deploy and Run Integration Tests
    # The caller holds the selected environment's concurrency group until this job finishes.
    environment: ${{ inputs.target-environment }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      PACKAGE_VERSION: ${{ inputs.package-version }}
      TEST_ASSEMBLY: DevPack.Tests/bin/Release/net48/Skyline.DataMiner.Dev.Utils.Solutions.MediaOps.Plan.Tests.dll

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - name: Validate fallback environment
        env:
          DATAMINER_HOST: ${{ vars.DATAMINER_HOST }}
          DATAMINER_USERNAME: ${{ secrets.DATAMINER_USERNAME }}
          DATAMINER_PASSWORD: ${{ secrets.DATAMINER_PASSWORD }}
          DATAMINER_TOKEN: ${{ secrets.DATAMINER_TOKEN }}
          SKYLINE__SDK__DATAMINERTOKEN: ${{ secrets.SKYLINE__SDK__DATAMINERTOKEN }}
        run: |
          foreach ($name in 'DATAMINER_HOST', 'DATAMINER_USERNAME', 'DATAMINER_PASSWORD', 'DATAMINER_TOKEN', 'SKYLINE__SDK__DATAMINERTOKEN') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required fallback setting '$name' is missing for the selected environment."
            }
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Configure GitHub NuGet Source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget add source "https://nuget.pkg.github.com/SkylineCommunications/index.json" --name github --username USERNAME --password "$env:GH_TOKEN" --store-password-in-clear-text

      - name: Install deployment tools
        run: |
          dotnet tool install --global Skyline.DataMiner.CICD.Tools.DataMinerDeploy --version 4.1.0 --add-source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tool install --global Skyline.DataMiner.CICD.Tools.CatalogUpload --version 4.4.2 --add-source https://api.nuget.org/v3/index.json
          exit $LASTEXITCODE

      - name: Build regression package and tests
        id: package
        env:
          Configuration: Release
          skyline__sdk__dataminertoken: ${{ secrets.SKYLINE__SDK__DATAMINERTOKEN }}
        run: |
          dotnet restore 'DevPack.Tests/Skyline.DataMiner.Dev.Utils.Solutions.MediaOps.Plan.Tests.csproj' -p:Configuration=Release -p:Version="$env:PACKAGE_VERSION" -p:DefineConstants=CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Build the same installer and Catalog references as QAOps without the test pipeline.
          # The standalone package build also builds the test assembly from this checkout.
          dotnet build 'QAOpsPackage/QAOpsPackage.csproj' -c Release -p:Version="$env:PACKAGE_VERSION" -p:DefineConstants=CI -p:DataMinerType=Package "-p:QAOpsHarvestingOutput=$env:RUNNER_TEMP/TestHarvesting/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path -LiteralPath $env:TEST_ASSEMBLY -PathType Leaf)) {
            throw "Test assembly not found: $env:TEST_ASSEMBLY"
          }
          $packages = @(Get-ChildItem 'QAOpsPackage/bin/Release' -Recurse -File -Filter "QAOpsPackage.$env:PACKAGE_VERSION.dmapp")
          if ($packages.Count -ne 1) { throw "Expected one QAOpsPackage.$env:PACKAGE_VERSION.dmapp; found $($packages.Count)" }

          [xml]$catalog = Get-Content 'QAOpsPackage/PackageContent/CatalogReferences.xml' -Raw
          $requiredEntries = @('Scripts/Install.xml', 'Scripts/InstallDependencies/Skyline.DataMiner.Dev.Utils.Solutions.MediaOps.Plan.dll')
          $requiredEntries += $catalog.CatalogReferences.CatalogReference | ForEach-Object {
            "AppInstallContent/AppPackages/$($_.Name).*.dmapp"
          }
          $archive = [IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $entries = $archive.Entries.FullName.Replace('\', '/')
            foreach ($entry in $requiredEntries) {
              if (-not ($entries -like $entry)) { throw "Regression package is missing '$entry'." }
            }
          } finally {
            $archive.Dispose()
          }
          "path=$($packages[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Verify approval still covers the current PR head and target
        if: github.event_name == 'pull_request_review'
        uses: actions/github-script@v8
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const { data: review } = await github.rest.pulls.getReview({
              owner, repo, pull_number, review_id: context.payload.review.id
            });
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== context.payload.pull_request.base.ref ||
                pr.head.repo.full_name !== `${owner}/${repo}` ||
                pr.head.sha !== process.env.SOURCE_SHA || review.state !== 'APPROVED' ||
                review.commit_id !== pr.head.sha) {
              throw new Error('PR approval is no longer valid for the current head or target. Approve the latest commit to run regression.');
            }

      - name: Volatile upload and deploy regression package
        env:
          DATAMINER_TOKEN: ${{ secrets.DATAMINER_TOKEN }}
          APPLICATION_PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          $artifact = & dataminer-catalog-upload --path-to-artifact "$env:APPLICATION_PACKAGE" --dm-catalog-token "$env:DATAMINER_TOKEN"
          if ($LASTEXITCODE -ne 0 -or -not $artifact) { throw 'Volatile upload failed' }
          & dataminer-package-deploy from-volatile --artifact-id ($artifact -join "`n") --dm-system-token "$env:DATAMINER_TOKEN"
          if ($LASTEXITCODE -ne 0) { throw "Volatile deployment failed with exit code $LASTEXITCODE" }

      - name: Run Integration Tests
        env:
          CRED_PREFIX: DATAMINER
          MEDIAOPS_PLAN_USE_REAL_DMA: 'true'
          MEDIAOPS_PLAN_LEGACY_RC_RUN: ${{ inputs.target-environment == 'MediaOps RC' && 'true' || 'false' }}
          DATAMINER_HOST: ${{ vars.DATAMINER_HOST }}
          DATAMINER_DOMAIN: ${{ vars.DATAMINER_DOMAIN }}
          DATAMINER_USERNAME: ${{ secrets.DATAMINER_USERNAME }}
          DATAMINER_PASSWORD: ${{ secrets.DATAMINER_PASSWORD }}
        run: |
          dotnet vstest "$env:TEST_ASSEMBLY" /Settings:DevPack.Tests.runsettings /Parallel '/Logger:trx;LogFileName=results.trx' `
            "/ResultsDirectory:$env:RUNNER_TEMP/plan-integration-results" -- MSTest.Parallelize.Workers=2 MSTest.Parallelize.Scope=MethodLevel RunConfiguration.TreatNoTestsAsError=true
          if ($LASTEXITCODE -ne 0) { throw "Integration tests failed with exit code $LASTEXITCODE" }

      - name: Upload fallback test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fallback-results
          path: ${{ runner.temp }}/plan-integration-results/*.trx
          if-no-files-found: ignore
          retention-days: 14
