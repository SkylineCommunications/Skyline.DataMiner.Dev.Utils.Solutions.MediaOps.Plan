name: Plan CICD

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - '*.*.X'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-**'
  pull_request:
    branches:
      - '**'
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  packages: read

env:
  # https://github.com/NuGet/Home/issues/7575#issuecomment-443801131
  NUGET_RESTORE_MSBUILD_ARGS: /p:Configuration=Release

jobs:
  nuget_validation:
    name: Validate NuGets
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' &&
       !github.event.pull_request.draft && github.event.review.commit_id == github.event.pull_request.head.sha)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install dotnet-consolidate
        run: dotnet tool install -g dotnet-consolidate

      - name: Run dotnet consolidate
        run: dotnet consolidate -s 'MediaOps Plan.slnx'

  tag_branch_validation:
    name: Validate Tag Matches Branch
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' &&
       !github.event.pull_request.draft && github.event.review.commit_id == github.event.pull_request.head.sha)
    runs-on: ubuntu-latest
    outputs:
      target_environment: ${{ steps.target.outputs.use_rc_dma == 'true' && vars.DMA_RC_ENABLED != 'false' && 'dma-rc' || '' }}
    steps:
      - name: Not a stable tag -> skip branch validation (success)
        if: github.ref_type != 'tag' || contains(github.ref_name, '-')
        run: echo "Ref '$GITHUB_REF' does not require stable tag/branch validation."

      - name: Checkout
        if: github.ref_type == 'tag'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Validate stable tag is on matching *.X branch
        if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$TAG_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
          else
            echo "Tag '$TAG_NAME' does not match expected version pattern."
            exit 1
          fi

          BRANCH="${MAJOR}.${MINOR}.X"
          git fetch origin "${BRANCH}:${BRANCH}" --tags

          TAG_SHA="$(git rev-list -n 1 "${TAG_NAME}")"
          BRANCH_SHA="$(git rev-list -n 1 "${BRANCH}")"
          echo "Tag commit:  $TAG_SHA"
          echo "Branch head: $BRANCH_SHA"

          if git merge-base --is-ancestor "$TAG_SHA" "$BRANCH_SHA"; then
            echo "OK: Tag '$TAG_NAME' is contained in branch '$BRANCH'."
          else
            echo "ERROR: Tag '$TAG_NAME' is NOT contained in branch '$BRANCH'."
            exit 1
          fi

      - name: Select tag test environment
        id: target
        if: github.ref_type == 'tag'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `main...${context.sha}`,
              per_page: 1,
            });
            const onMain = cmp.status === 'identical' || cmp.status === 'behind';
            core.info(`Tagged commit ${context.sha} is ${onMain ? '' : 'not '}on main (compare status: ${cmp.status}).`);
            core.setOutput('use_rc_dma', String(!onMain));

  unit_tests:
    name: Unit Tests
    needs: [nuget_validation, tag_branch_validation]
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' &&
       !github.event.pull_request.draft && github.event.review.commit_id == github.event.pull_request.head.sha)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      MEDIAOPS_PLAN_USE_REAL_DMA: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Configure GitHub NuGet Source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget add source "https://nuget.pkg.github.com/SkylineCommunications/index.json" --name github --username USERNAME --password "$env:GH_TOKEN" --store-password-in-clear-text

      - name: Restore and Build Unit Tests
        run: dotnet build "DevPack.Tests/Skyline.DataMiner.Dev.Utils.Solutions.MediaOps.Plan.Tests.csproj" -c Release -p:WarningLevel=0 -p:DefineConstants=CI

      - name: Run Unit Tests
        run: dotnet test "DevPack.Tests/Skyline.DataMiner.Dev.Utils.Solutions.MediaOps.Plan.Tests.csproj" -c Release --no-build --settings DevPack.Tests.runsettings --logger "console;verbosity=detailed"

  integration_tests:
    name: Integration Tests
    needs: [unit_tests, tag_branch_validation]
    # Alpha tag pushes use the simulated suite in Unit Tests; other tags also require QAOps.
    if: >-
      ${{ !cancelled() && needs.unit_tests.result == 'success' &&
          ((github.event_name == 'push' && github.ref_type == 'tag' && !contains(github.ref_name, '-alpha')) ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' &&
           !github.event.pull_request.draft && github.event.review.commit_id == github.event.pull_request.head.sha &&
           github.event.pull_request.base.ref == 'main' &&
           github.event.pull_request.head.repo.full_name == github.repository)) }}
    permissions:
      contents: read
      packages: read
      pull-requests: read
    concurrency:
      group: mediaops-plan-regression-${{ needs.tag_branch_validation.outputs.target_environment || 'default' }}
      cancel-in-progress: false
      queue: max
    # dma-rc overrides repository-level QAOps settings; DMA_RC_ENABLED=false selects the default target.
    environment: ${{ needs.tag_branch_validation.outputs.target_environment }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      TEST_PACKAGE_PROJECT: QAOpsPackage/QAOpsPackage.csproj
      PACKAGE_VERSION: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || format('0.1.{0}', github.run_number) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Configure GitHub NuGet Source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget add source "https://nuget.pkg.github.com/SkylineCommunications/index.json" --name github --username USERNAME --password "$env:GH_TOKEN" --store-password-in-clear-text

      - name: Install QAOps CLI
        run: dotnet tool install --global Skyline.DataMiner.QAOps --version 3.0.6 --add-source https://api.nuget.org/v3/index.json

      - name: Build Test Package
        id: package
        run: |
          dotnet restore "DevPack.Tests/Skyline.DataMiner.Dev.Utils.Solutions.MediaOps.Plan.Tests.csproj" -p:Configuration=Release -p:Version="$env:PACKAGE_VERSION" -p:DefineConstants=CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet build "$env:TEST_PACKAGE_PROJECT" -c Release -p:Version="$env:PACKAGE_VERSION" -p:DefineConstants=CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $projectName = [IO.Path]::GetFileNameWithoutExtension($env:TEST_PACKAGE_PROJECT)
          $outputDirectory = Join-Path (Split-Path $env:TEST_PACKAGE_PROJECT -Parent) 'bin/Release'
          $packages = @(Get-ChildItem $outputDirectory -Recurse -File -Filter "$projectName.$env:PACKAGE_VERSION.dmtest")
          if ($packages.Count -ne 1) { throw "Expected one $projectName.$env:PACKAGE_VERSION.dmtest; found $($packages.Count)" }
          "path=$($packages[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Verify approval still covers the current PR head
        if: github.event_name == 'pull_request_review'
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const { data: review } = await github.rest.pulls.getReview({
              owner, repo, pull_number, review_id: context.payload.review.id
            });
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' || pr.head.repo.full_name !== `${owner}/${repo}` ||
                pr.head.sha !== process.env.SOURCE_SHA || review.state !== 'APPROVED' ||
                review.commit_id !== pr.head.sha) {
              throw new Error('PR approval is no longer valid for the current head. Approve the latest commit to run integration tests.');
            }

      - name: Run QAOps and wait for results
        env:
          QAOPS_TOKEN: ${{ secrets.QAOPS_TOKEN }}
          QAOPS_TEST_SUITE_ID: ${{ vars.QAOPS_TEST_SUITE_ID }}
          QAOPS_CONFIGURATION_ID: ${{ vars.QAOPS_CONFIGURATION_ID }}
          TEST_PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          $startInfo = [Diagnostics.ProcessStartInfo]::new((Get-Command dataminer-qaops).Source)
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          foreach ($argument in @(
            'test-run-and-wait',
            '--testsuite-id', $env:QAOPS_TEST_SUITE_ID,
            '--configuration-id', $env:QAOPS_CONFIGURATION_ID,
            '--test-packages', $env:TEST_PACKAGE,
            '-tags', "gha-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT",
            '--result-filepath', "$env:RUNNER_TEMP/qaops-results.json"
          )) { $startInfo.ArgumentList.Add($argument) }

          $process = [Diagnostics.Process]::Start($startInfo)
          try {
            $readers = @($process.StandardOutput, $process.StandardError)
            $pending = @($readers[0].ReadLineAsync(), $readers[1].ReadLineAsync())
            $pollingMessage = $null
            $responseTimer = $null
            while ($pending[0] -or $pending[1]) {
              [void][Threading.Tasks.Task]::WaitAny([Threading.Tasks.Task[]]@($pending | Where-Object { $null -ne $_ }), 1000)
              for ($i = 0; $i -lt $pending.Count; $i++) {
                if ($null -eq $pending[$i] -or !$pending[$i].IsCompleted) { continue }
                $line = $pending[$i].GetAwaiter().GetResult()
                if ($null -eq $line) {
                  $pending[$i] = $null
                  continue
                }

                Write-Host $line
                if ($null -eq $pollingMessage -and $line.Contains('Waiting and polling logs from response queue (')) {
                  $pollingMessage = $line
                  $responseTimer = [Diagnostics.Stopwatch]::StartNew()
                } elseif ($null -ne $responseTimer -and ![string]::IsNullOrWhiteSpace($line) -and $line -ne $pollingMessage) {
                  # Only guard the initial response, not subsequent test execution.
                  $responseTimer = $null
                }
                $pending[$i] = $readers[$i].ReadLineAsync()
              }

              if ($null -ne $responseTimer -and $responseTimer.Elapsed.TotalMinutes -ge 10) {
                throw 'QAOps produced no new message within 10 minutes after starting response-queue polling.'
              }
            }
            $process.WaitForExit()
            $exitCode = $process.ExitCode
          } finally {
            if (!$process.HasExited) { $process.Kill($true) }
            $process.Dispose()
          }
          exit $exitCode

      - name: Upload QAOps results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qaops-results
          path: ${{ runner.temp }}/qaops-results.json
          if-no-files-found: ignore
          retention-days: 14

  skyline_cicd:
    name: Skyline CICD
    needs: [nuget_validation, tag_branch_validation, unit_tests, integration_tests]
    # Merge pushes require validation and unit tests; tag pushes also require passing regression.
    if: >-
      ${{ !cancelled() && github.event_name == 'push' &&
          needs.nuget_validation.result == 'success' && needs.tag_branch_validation.result == 'success' &&
          needs.unit_tests.result == 'success' &&
          (github.ref_type == 'branch' ||
            (github.ref_type == 'tag' && needs.integration_tests.result == 'success')) }}
    permissions:
      contents: read
      id-token: write
      packages: write
      actions: read
      pull-requests: write
    uses: SkylineCommunications/_ReusableWorkflows/.github/workflows/Master Workflow.yml@main
    with:
      nuget-push-source: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') && 'https://api.nuget.org/v3/index.json' || 'https://nuget.pkg.github.com/SkylineCommunications/index.json' }}
    secrets:
      NUGET_API_KEY: ${{ secrets[github.ref_type == 'tag' && !contains(github.ref_name, '-') && 'NUGETAPIKEY' || 'NUGETAPIKEY_GITHUB'] }}
